# Incomplete until the ACTIVE user-service contract is supplied.
services:
  frontend:
    build:
      context: ../frontend/goal-stats-app
      dockerfile: Dockerfile
      target: runtime
    init: true
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-33001}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 10s
      retries: 20
      start_period: 5s
